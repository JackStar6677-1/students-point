<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar Email - StudentsPoint</title>
  
  <!-- Favicon -->
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/icon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/images/icons/icon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/images/icons/icon-192x192.png" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Tema Oscuro Premium -->
  <link rel="stylesheet" href="/static/css/theme-dark.css" />
  <link rel="stylesheet" href="/static/css/animations.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  
  <!-- PWA Meta -->
  <meta name="theme-color" content="#1a0933">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!-- Fondo de partículas -->
  <div class="particles-bg"></div>

  <!-- Container principal -->
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-4 mx-auto">
        
        <!-- Card de verificación -->
        <div class="card-premium glass fade-in">
          <div class="text-center mb-4">
            <!-- Logo -->
            <div class="mb-4">
              <img src="/static/images/Logo_StudentsPoint.svg.png" alt="StudentsPoint" class="img-fluid" style="max-height: 80px;">
            </div>
            
            <!-- Icono de verificación -->
            <div class="mb-4">
              <i class="fas fa-envelope-open-text fa-4x text-gradient-gold"></i>
            </div>
            
            <h2 class="text-gradient-gold mb-3">Verificar Email</h2>
            <p class="text-white-50 mb-4">Ingresa el código de verificación que enviamos a tu correo electrónico</p>
          </div>

          <!-- Formulario de verificación -->
          <form id="verifyForm">
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required 
                     placeholder="tu@email.com" readonly>
            </div>
            
            <div class="mb-4">
              <label for="codigo" class="form-label">Código de Verificación</label>
              <input type="text" class="form-control text-center" id="codigo" name="codigo" required 
                     placeholder="123456" maxlength="6" pattern="[0-9]{6}">
              <div class="form-text text-white-50">Código de 6 dígitos enviado a tu email</div>
            </div>
            
            <!-- Botones -->
            <div class="d-grid gap-2 mb-4">
              <button type="submit" class="btn btn-gradient-purple btn-ripple" id="verifyBtn">
                <i class="fas fa-check-circle"></i> Verificar Email
              </button>
              
              <button type="button" class="btn btn-secondary" id="resendBtn">
                <i class="fas fa-redo"></i> Reenviar Código
              </button>
            </div>
          </form>

          <!-- Links adicionales -->
          <div class="text-center">
            <p class="text-white-50 mb-2">¿No recibiste el código?</p>
            <p class="text-white-50 mb-3">Revisa tu carpeta de spam o solicita uno nuevo</p>
            <a href="/login.html" class="text-gradient-purple">
              <i class="fas fa-arrow-left"></i> Volver al Login
            </a>
          </div>
        </div>
        
        <!-- Alert container -->
        <div id="alertContainer" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/sounds.js"></script>
    <script src="/static/js/auth-api.js"></script>
  <script src="/static/js/pwa-config.js"></script>

  <style>
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--gradient-primary);
      z-index: -1;
      overflow: hidden;
    }

    .particles-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(107, 70, 193, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(30, 64, 175, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite;
    }

    @keyframes bgShift {
      0%, 100% { transform: translateX(0) translateY(0); }
      33% { transform: translateX(-10px) translateY(-10px); }
      66% { transform: translateX(10px) translateY(10px); }
    }

    .form-control:focus {
      border-color: var(--color-purple-vibrant);
      box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.2);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>

  <script>
    // Obtener email de la URL
    function getEmailFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('email');
    }

    // Mostrar alertas
    function showAlert(message, type = 'info') {
      const alertContainer = document.getElementById('alertContainer');
      const alertClass = {
        'success': 'alert-success',
        'error': 'alert-danger',
        'warning': 'alert-warning',
        'info': 'alert-info'
      }[type] || 'alert-info';

      alertContainer.innerHTML = `
        <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
          <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'}"></i>
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    // Verificar código
    document.getElementById('verifyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const verifyBtn = document.getElementById('verifyBtn');
      const email = document.getElementById('email').value;
      const codigo = document.getElementById('codigo').value;
      
      if (!codigo || codigo.length !== 6) {
        showAlert('Por favor ingresa un código de 6 dígitos', 'warning');
        return;
      }
      
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
      
      try {
        const data = await window.authAPI.verifyEmail(email, codigo);
        
        if (data.status === 'success') {
          showAlert('¡Email verificado exitosamente! Redirigiendo...', 'success');
          if (window.playSound) window.playSound('success');
          
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 2000);
        } else {
          showAlert(data.message || 'Código incorrecto o expirado', 'error');
          if (window.playSound) window.playSound('error');
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verificar Email';
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert(error.message || 'Error de conexión. Por favor, intenta de nuevo.', 'error');
        if (window.playSound) window.playSound('error');
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verificar Email';
      }
    });

    // Reenviar código
    document.getElementById('resendBtn').addEventListener('click', async function() {
      const resendBtn = document.getElementById('resendBtn');
      const email = document.getElementById('email').value;
      
      if (!email) {
        showAlert('Email requerido para reenviar código', 'warning');
        return;
      }
      
      resendBtn.disabled = true;
      resendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
      
      try {
        const data = await window.authAPI.resendVerificationCode(email);
        
        if (data.status === 'success') {
          showAlert('Código reenviado exitosamente', 'success');
          if (window.playSound) window.playSound('success');
        } else {
          showAlert(data.message || 'Error al reenviar código', 'error');
          if (window.playSound) window.playSound('error');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert(error.message || 'Error de conexión. Por favor, intenta de nuevo.', 'error');
        if (window.playSound) window.playSound('error');
      } finally {
        resendBtn.disabled = false;
        resendBtn.innerHTML = '<i class="fas fa-redo"></i> Reenviar Código';
      }
    });

    // Auto-focus en código
    document.getElementById('codigo').addEventListener('input', function(e) {
      // Solo permitir números
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      
      // Auto-submit si se completa el código
      if (e.target.value.length === 6) {
        setTimeout(() => {
          document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
        }, 500);
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      // Obtener email de la URL
      const email = getEmailFromURL();
      if (email) {
        document.getElementById('email').value = email;
        document.getElementById('codigo').focus();
      }
      
      // Play page load sound
      if (window.playSound) {
        window.playSound('pageLoad');
      }
    });
  </script>
</body>
</html>
