<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - StudentsPoint</title>
    
    <!-- Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/theme-dark.css">
    <link rel="stylesheet" href="/static/css/base-layout.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    
    <style>
        .producto-card {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }
        .producto-card:hover {
            border-color: #4a4a4a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-link-externo {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-link-externo:hover {
            background: #5a52d5;
            color: white;
        }
        .badge {
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .badge.bg-secondary {
            background-color: #ffa726 !important;
            color: #000;
        }
        .badge.bg-success {
            background-color: #66bb6a !important;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-section">
                    <img src="/static/images/Logo_StudentsPoint.svg.png" alt="StudentsPoint" class="brand-logo">
                    <h1 class="brand-title">StudentsPoint</h1>
                </div>
                <div class="user-section">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="sidebarUserName">Cargando...</span>
                        <span class="user-role" id="sidebarUserRole">Estudiante</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-menu">
                <a href="/" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="/forum/" class="menu-item">
                    <i class="fas fa-comments"></i>
                    <span>Foro</span>
                </a>
                <a href="/market/" class="menu-item active">
                    <i class="fas fa-store"></i>
                    <span>Marketplace</span>
                </a>
                <a href="/portfolio/" class="menu-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Portafolio</span>
                </a>
                <a href="/cursos/" class="menu-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Cursos</span>
                </a>
                <a href="/encuestas/" class="menu-item">
                    <i class="fas fa-poll"></i>
                    <span>Encuestas</span>
                </a>
                <a href="/reportes/" class="menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reportes</span>
                </a>
                <a href="/bienestar/" class="menu-item">
                    <i class="fas fa-heart"></i>
                    <span>Bienestar</span>
                </a>
                <a href="/converter/" class="menu-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Conversor</span>
                </a>
                <a href="/streetview/" class="menu-item">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Recorridos</span>
                </a>
            </div>
            
            <div class="sidebar-footer">
                <a href="/account.html" class="menu-item">
                    <i class="fas fa-user-circle"></i>
                    <span>Mi Cuenta</span>
                </a>
                <a href="#" class="menu-item" onclick="logout(); return false;">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="header-title">Marketplace Estudiantil</h1>
                <div class="header-actions">
                    <button class="btn btn-gradient-purple" data-bs-toggle="modal" data-bs-target="#modalPublicar">
                        <i class="fas fa-plus me-2"></i>Publicar Producto
                    </button>
                    <button class="btn-icon" id="notificationsBtn" title="Notificaciones">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button class="btn-icon" id="settingsBtn" title="Configuración">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <div class="content-wrapper fade-in">
                <div class="glass p-4 mb-4">
                    <p class="text-muted mb-0">
                        <i class="fas fa-info-circle me-2"></i>
                        Descubre productos y servicios de la comunidad estudiantil
                    </p>
                </div>
                
                <div id="productos"></div>
            </div>
        </main>
    </div>
    
    <!-- Modal -->
    <div class="modal fade" id="modalPublicar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h5 class="modal-title">Publicar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form">
                        <div class="mb-3">
                            <label>Descripción *</label>
                            <textarea class="form-control" id="descripcion" required rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Link *</label>
                            <input type="url" class="form-control" id="url" required>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label>Precio (CLP)</label>
                                <input type="number" class="form-control" id="precio">
                            </div>
                            <div class="col">
                                <label>Precio Estudiante (CLP)</label>
                                <input type="number" class="form-control" id="precioEstudiante">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="publicar()">Publicar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/mobile-menu.js"></script>
    <script src="/static/js/auth-api.js"></script>
    <script src="/static/js/auth-header.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        const API = '/api/market/productos/';
        
        function getToken() {
            return localStorage.getItem('access_token');
        }
        
        async function cargar() {
            try {
                const res = await fetch(API);
                const productos = await res.json();
                
                const html = productos.map(p => `
                    <div class="producto-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <p class="mb-3">${p.descripcion}</p>
                                <div class="d-flex gap-2 align-items-center flex-wrap">
                                    ${p.precio ? `<span class="badge bg-secondary">💰 $${Number(p.precio).toLocaleString()}</span>` : ''}
                                    ${p.precio_estudiante ? `<span class="badge bg-success">🎓 $${Number(p.precio_estudiante).toLocaleString()}</span>` : ''}
                                    <small class="text-muted ms-2">${p.fecha}</small>
                                </div>
                            </div>
                            <div class="ms-3">
                                <a href="${p.url}" target="_blank" class="btn-link-externo">
                                    Ver Producto <i class="fas fa-external-link-alt ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('productos').innerHTML = html || '<div class="glass p-4 text-center"><p class="text-muted mb-0">No hay productos publicados</p></div>';
            } catch (e) {
                console.error(e);
            }
        }
        
        async function publicar() {
            const token = getToken();
            if (!token) {
                alert('Debes iniciar sesión');
                return;
            }
            
            const data = {
                descripcion: document.getElementById('descripcion').value,
                url: document.getElementById('url').value,
                precio: document.getElementById('precio').value || null,
                precio_estudiante: document.getElementById('precioEstudiante').value || null
            };
            
            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    alert('¡Publicado!');
                    document.getElementById('form').reset();
                    bootstrap.Modal.getInstance(document.getElementById('modalPublicar')).hide();
                    cargar();
                } else {
                    alert('Error al publicar');
                }
            } catch (e) {
                console.error(e);
                alert('Error');
            }
        }
        
        cargar();
    </script>
</body>
</html>
