<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - StudentsPoint</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tema Oscuro Premium -->
    <link rel="stylesheet" href="/static/css/theme-dark.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/components.css">
    
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4A148C">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/icons/icon-192x192.png">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    
    <!-- Background Pattern -->
    <div class="hero-background bg-pattern"></div>
    <div class="hero-particles" id="particles"></div>
    
    <!-- Register Container -->
    <div class="glass animate-scale-in" style="max-width: 600px; width: 100%; padding: 3rem; border-radius: 1.5rem; position: relative; z-index: 10;">
        <!-- Logo -->
        <div class="text-center mb-4">
            <img src="/static/images/Logo_StudentsPoint.svg.png" alt="StudentsPoint" style="height: 70px; margin-bottom: 1rem;" class="animate-float">
            <h2 class="text-gradient-purple">Crear Cuenta</h2>
            <p style="color: var(--color-gray-light); margin-top: 0.5rem;">
                Únete a la comunidad estudiantil
            </p>
        </div>
        
        <!-- Alert Container -->
        <div id="alertContainer"></div>
        
        <!-- Register Form -->
        <form id="registerForm">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Nombre Completo
                        </label>
                        <input type="text" class="form-input" id="name" placeholder="Tu nombre" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email" class="form-input" id="email" placeholder="tu@email.com" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-graduation-cap"></i> Carrera
                        </label>
                        <select class="form-input form-select" id="career" required>
                            <option value="">Selecciona tu carrera</option>
                            <option value="Ingeniería en Informática">Ingeniería en Informática</option>
                            <option value="Ingeniería en Conectividad y Redes">Ingeniería en Conectividad y Redes</option>
                            <option value="Ingeniería en Construcción">Ingeniería en Construcción</option>
                            <option value="Ingeniería en Electricidad">Ingeniería en Electricidad</option>
                            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                            <option value="Derecho">Derecho</option>
                            <option value="Medicina">Medicina</option>
                            <option value="Arquitectura">Arquitectura</option>
                            <option value="Psicología">Psicología</option>
                            <option value="Administración de Empresas">Administración de Empresas</option>
                            <option value="Contabilidad">Contabilidad</option>
                            <option value="Técnico en Informática">Técnico en Informática</option>
                            <option value="Estudiante Genérico">Estudiante Genérico</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-book"></i> Semestre
                        </label>
                        <select class="form-input form-select" id="semestre" required>
                            <option value="">Selecciona</option>
                            <option value="1">1° Semestre</option>
                            <option value="2">2° Semestre</option>
                            <option value="3">3° Semestre</option>
                            <option value="4">4° Semestre</option>
                            <option value="5">5° Semestre</option>
                            <option value="6">6° Semestre</option>
                            <option value="7">7° Semestre</option>
                            <option value="8">8° Semestre</option>
                            <option value="9">9° Semestre</option>
                            <option value="10">10° Semestre</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Contraseña
                        </label>
                        <div style="position: relative;">
                            <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                            <button type="button" class="btn" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-gray-light); padding: 0;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <!-- Password Strength Indicator -->
                        <div class="progress-bar mt-2" style="height: 4px;">
                            <div class="progress-fill" id="passwordStrength" style="width: 0%; transition: all 0.3s ease;"></div>
                        </div>
                        <small id="passwordStrengthText" style="color: var(--color-gray-medium);"></small>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Confirmar Contraseña
                        </label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="••••••••" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="terms" required style="width: 18px; height: 18px; cursor: pointer; margin-top: 2px;">
                    <span style="color: var(--color-gray-light); font-size: 0.875rem;">
                        Acepto los <a href="#" class="text-gradient-purple">términos y condiciones</a> y la <a href="#" class="text-gradient-purple">política de privacidad</a>
                    </span>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="registerBtn">
                <i class="fas fa-user-plus"></i> Crear Cuenta
            </button>
            
            <p class="text-center" style="color: var(--color-gray-light); margin-top: 2rem;">
                ¿Ya tienes cuenta? 
                <a href="/login.html" class="text-gradient-gold" style="font-weight: 600;">Inicia sesión aquí</a>
            </p>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/sounds.js"></script>
    <script src="/static/js/auth-api.js"></script>
    
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
            
            if (window.playSound) window.playSound('click');
        });
        
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('passwordStrengthText');
            
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 25;
            
            strengthBar.style.width = strength + '%';
            
            if (strength <= 25) {
                strengthBar.style.background = 'var(--color-danger-color, #ef4444)';
                strengthText.textContent = 'Débil';
                strengthText.style.color = '#ef4444';
            } else if (strength <= 50) {
                strengthBar.style.background = 'var(--color-warning-color, #f59e0b)';
                strengthText.textContent = 'Media';
                strengthText.style.color = '#f59e0b';
            } else if (strength <= 75) {
                strengthBar.style.background = 'var(--gradient-blue)';
                strengthText.textContent = 'Buena';
                strengthText.style.color = '#3b82f6';
            } else {
                strengthBar.style.background = 'var(--gradient-gold)';
                strengthText.textContent = 'Excelente';
                strengthText.style.color = '#fbbf24';
            }
        });
        
        // Show alert
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alertContainer');
            let alertClass, iconClass;
            if (type === 'success') {
                alertClass = 'alert-success';
                iconClass = 'check-circle';
            } else if (type === 'warning') {
                alertClass = 'alert-warning';
                iconClass = 'exclamation-triangle';
            } else if (type === 'info') {
                alertClass = 'alert-success'; // Usar verde para info también
                iconClass = 'info-circle';
            } else {
                alertClass = 'alert-error';
                iconClass = 'exclamation-circle';
            }
            container.innerHTML = `
                <div class="${alertClass} animate-fade-in" style="margin-bottom: 1.5rem;">
                    <i class="fas fa-${iconClass}"></i>
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Register form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const career = document.getElementById('career').value;
            const semestre = document.getElementById('semestre').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const registerBtn = document.getElementById('registerBtn');
            
            // Validations
            if (password !== confirmPassword) {
                showAlert('Las contraseñas no coinciden');
                if (window.playSound) window.playSound('error');
                return;
            }
            
            if (password.length < 8) {
                showAlert('La contraseña debe tener al menos 8 caracteres');
                if (window.playSound) window.playSound('error');
                return;
            }
            
            if (!terms) {
                showAlert('Debes aceptar los términos y condiciones');
                if (window.playSound) window.playSound('error');
                return;
            }
            
            // Disable button
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando cuenta...';
            
            try {
                const data = await window.authAPI.register({
                    name,
                    email,
                    career,
                    semestre: parseInt(semestre),
                    password
                });
                
                // Verificar si el email fue verificado
                if (data.user && data.user.is_email_verified) {
                    showAlert('¡Cuenta creada exitosamente! Redirigiendo...', 'success');
                    if (window.playSound) window.playSound('success');
                    
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                } else {
                    // Mostrar mensaje de verificación
                    showAlert(data.message || '¡Cuenta creada! Por favor verifica tu email con el código enviado.', 'success');
                    if (window.playSound) window.playSound('success');
                    
                    setTimeout(() => {
                        window.location.href = `/verify-email.html?email=${encodeURIComponent(email)}`;
                    }, 2000);
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert(error.message || 'Error al crear la cuenta. Por favor, intenta de nuevo.');
                if (window.playSound) window.playSound('error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Crear Cuenta';
            }
        });
        
        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 25;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = 'rgba(139, 92, 246, 0.4)';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `particleFloat ${Math.random() * 10 + 10}s linear infinite`;
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // Start background music
            setTimeout(() => {
                if (window.playBackgroundMusic) {
                    window.playBackgroundMusic();
                }
            }, 1000);
            
            // Play page load sound
            if (window.playSound) {
                window.playSound('pageLoad');
            }
        });
    </script>
    
    <!-- PWA Scripts -->
    <script src="/static/pwa-config.js"></script>
    <script src="/static/js/pwa.js"></script>
</body>
</html>
