<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentsPoint | Mi Cuenta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/students-theme.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>StudentsPoint
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/forum/foro.html">Foro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/market/mercado.html">Marketplace</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/account.html">Mi Cuenta</a>
                    </li>
                </ul>
                <div class="d-flex auth-buttons"></div>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <header class="mb-4">
                <h1 class="h3 mb-1">
                    <i class="fas fa-user-circle me-2 text-primary"></i>Bienvenido, <span data-profile="name">Usuario</span>
                </h1>
                <p class="text-muted mb-0">Administra tu información personal, estado de cuenta y seguridad.</p>
            </header>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <h2 class="h6 mb-0"><i class="fas fa-id-card me-2 text-primary"></i>Información personal</h2>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" class="form-control" id="profileEmail" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Carrera</label>
                                <input type="text" class="form-control" id="profileCareer" readonly>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Semestre</label>
                                    <input type="text" class="form-control" id="profileSemester" readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Campus</label>
                                    <input type="text" class="form-control" id="profileCampus" readonly>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rol</label>
                                <input type="text" class="form-control" id="profileRole" readonly>
                            </div>
                            <p class="mb-2" id="emailStatus" class="text-muted">Verificando correo…</p>
                            <button id="verifyEmailBtn" class="btn btn-outline-primary btn-sm d-none">
                                <i class="fas fa-envelope me-2"></i>Reenviar verificación
                            </button>
                            <hr class="my-4">
                            <button id="editProfileBtn" class="btn btn-primary">
                                <i class="fas fa-edit me-2"></i>Editar información
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <h2 class="h6 mb-0"><i class="fas fa-key me-2 text-primary"></i>Cambiar contraseña</h2>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Contraseña actual</label>
                                <input type="password" class="form-control" id="currentPassword" autocomplete="current-password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nueva contraseña</label>
                                <input type="password" class="form-control" id="newPassword" autocomplete="new-password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirmar nueva contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password">
                            </div>
                            <button id="changePasswordBtn" class="btn btn-primary w-100">
                                <i class="fas fa-lock me-2"></i>Actualizar contraseña
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <section id="editSection" class="card shadow-sm mt-4 d-none">
                <div class="card-header bg-white">
                    <h2 class="h6 mb-0"><i class="fas fa-user-edit me-2 text-primary"></i>Editar información</h2>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="editName" placeholder="Nombre completo">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Carrera</label>
                            <select class="form-select" id="editCareer">
                                <option value="">Cargando carreras...</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Semestre</label>
                            <input type="number" class="form-control" id="editSemester" min="1" max="12">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="saveProfileBtn" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Guardar cambios
                        </button>
                        <button id="cancelEditBtn" class="btn btn-outline-secondary">
                            Cancelar
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth-api.js"></script>
    <script src="/static/js/auth-header.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/account.js"></script>
</body>
</html>
