<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - StudentsPoint</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tema Oscuro Premium -->
    <link rel="stylesheet" href="/static/css/theme-dark.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <!-- Navbar Premium -->
    <nav class="navbar-premium" id="navbar">
        <div class="navbar-content">
            <div class="navbar-logo">
                <a href="/">
                    <img src="/static/images/Logo_StudentsPoint.svg.png" alt="StudentsPoint" height="40">
                </a>
            </div>
            
            <ul class="navbar-menu">
                <li><a href="/" class="navbar-link">Inicio</a></li>
                <li><a href="/forum/" class="navbar-link">Foros</a></li>
                <li><a href="/market/" class="navbar-link">Marketplace</a></li>
                <li><a href="/portfolio/" class="navbar-link">Portafolio</a></li>
                <li><a href="/bienestar/" class="navbar-link">Bienestar</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div class="audio-controls">
                    <button class="audio-btn active" id="musicToggle">
                        <i class="fas fa-music"></i>
                    </button>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-slider-fill" id="volumeFill" style="width: 70%"></div>
                    </div>
                    <button class="audio-btn active" id="soundToggle">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
                <img src="/static/images/icons/icon-192x192.png" alt="Usuario" class="avatar-premium" id="userAvatar" style="cursor: pointer;">
            </div>
        </div>
    </nav>

    <!-- Profile Container -->
    <div class="container-dark" style="padding-top: 6rem; padding-bottom: 4rem; min-height: 100vh;">
        <!-- Profile Header -->
        <div class="card-premium animate-fade-in" style="margin-bottom: 2rem;">
            <div class="text-center">
                <div style="position: relative; display: inline-block; margin-bottom: 1.5rem;">
                    <img src="/static/images/icons/icon-192x192.png" alt="Avatar" class="avatar-premium avatar-large" id="profileAvatar">
                    <button class="btn btn-sm" id="changeAvatarBtn" style="position: absolute; bottom: 0; right: 0; background: var(--gradient-gold); border-radius: 50%; width: 35px; height: 35px; padding: 0; border: 2px solid var(--color-dark-primary);">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                <h2 id="userName" style="color: var(--color-white); margin-bottom: 0.5rem;">Cargando...</h2>
                <p id="userEmail" style="color: var(--color-gray-light); margin-bottom: 0.5rem;"></p>
                <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <span class="badge-premium">
                        <i class="fas fa-graduation-cap"></i> <span id="userCareer">-</span>
                    </span>
                    <span class="badge-purple">
                        <i class="fas fa-book"></i> Semestre <span id="userSemestre">-</span>
                    </span>
                    <span class="badge-premium" id="userRole">
                        <i class="fas fa-user"></i> Estudiante
                    </span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="card-premium animate-fade-in delay-200">
            <ul class="nav nav-tabs mb-4" style="border-bottom: 2px solid rgba(107, 70, 193, 0.3);">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#perfil" style="color: var(--color-white); border: none;">
                        <i class="fas fa-user"></i> Perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#seguridad" style="color: var(--color-gray-light); border: none;">
                        <i class="fas fa-lock"></i> Seguridad
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#preferencias" style="color: var(--color-gray-light); border: none;">
                        <i class="fas fa-cog"></i> Preferencias
                    </a>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Tab Perfil -->
                <div class="tab-pane fade show active" id="perfil">
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-user"></i> Nombre Completo
                                    </label>
                                    <input type="text" class="form-input" id="name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-envelope"></i> Email
                                    </label>
                                    <input type="email" class="form-input" id="email" disabled>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-graduation-cap"></i> Carrera
                                    </label>
                                    <select class="form-input form-select" id="career">
                                        <option value="Ingenieria en Informatica">Ingeniería en Informática</option>
                                        <option value="Ingenieria en Construccion">Ingeniería en Construcción</option>
                                        <option value="Derecho">Derecho</option>
                                        <option value="Medicina">Medicina</option>
                                        <option value="Estudiante Generico">Estudiante Genérico</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-book"></i> Semestre
                                    </label>
                                    <select class="form-input form-select" id="semestre">
                                        <option value="1">1° Semestre</option>
                                        <option value="2">2° Semestre</option>
                                        <option value="3">3° Semestre</option>
                                        <option value="4">4° Semestre</option>
                                        <option value="5">5° Semestre</option>
                                        <option value="6">6° Semestre</option>
                                        <option value="7">7° Semestre</option>
                                        <option value="8">8° Semestre</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                    </form>
                </div>

                <!-- Tab Seguridad -->
                <div class="tab-pane fade" id="seguridad">
                    <form id="passwordForm">
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Contraseña Actual
                            </label>
                            <input type="password" class="form-input" id="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-key"></i> Nueva Contraseña
                            </label>
                            <input type="password" class="form-input" id="newPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-key"></i> Confirmar Nueva Contraseña
                            </label>
                            <input type="password" class="form-input" id="confirmPassword" required>
                        </div>
                        
                        <button type="submit" class="btn btn-secondary btn-lg">
                            <i class="fas fa-shield-alt"></i> Cambiar Contraseña
                        </button>
                    </form>
                </div>

                <!-- Tab Preferencias -->
                <div class="tab-pane fade" id="preferencias">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-bell"></i> Notificaciones
                        </label>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <input type="checkbox" id="notificationsEnabled" checked style="width: 20px; height: 20px;">
                            <span style="color: var(--color-gray-light);">Recibir notificaciones push</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-music"></i> Audio
                        </label>
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" id="musicEnabled" checked style="width: 20px; height: 20px;">
                            <span style="color: var(--color-gray-light);">Música de fondo</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <input type="checkbox" id="soundsEnabled" checked style="width: 20px; height: 20px;">
                            <span style="color: var(--color-gray-light);">Efectos de sonido</span>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary btn-lg">
                        <i class="fas fa-save"></i> Guardar Preferencias
                    </button>
                </div>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="text-center mt-4">
            <button class="btn btn-outline" id="logoutBtn" style="border-color: var(--color-danger-color, #ef4444); color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" style="position: fixed; top: 6rem; right: 2rem; z-index: 9999; max-width: 400px;"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/sounds.js"></script>
    <script src="/static/js/pwa.js"></script>
    
    <script>
        // Show alert
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            const alert = document.createElement('div');
            alert.className = `${alertClass} animate-slide-in-right`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 300);
            }, 4000);
        }
        
        // Load user data
        async function loadUserData() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                
                const response = await fetch('/api/auth/me/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                
                const user = await response.json();
                
                // Update UI
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userCareer').textContent = user.career;
                document.getElementById('userSemestre').textContent = user.semestre || '1';
                
                // Update form
                document.getElementById('name').value = user.name;
                document.getElementById('email').value = user.email;
                document.getElementById('career').value = user.career;
                document.getElementById('semestre').value = user.semestre || '1';
                
                // Update avatar
                if (user.picture_url) {
                    document.getElementById('profileAvatar').src = user.picture_url;
                    document.getElementById('userAvatar').src = user.picture_url;
                }
                
                // Update role badge
                const roleMap = {
                    'student': 'Estudiante',
                    'moderator': 'Moderador',
                    'admin_global': 'Administrador',
                    'director_carrera': 'Director de Carrera'
                };
                document.getElementById('userRole').innerHTML = `
                    <i class="fas fa-user"></i> ${roleMap[user.role] || 'Estudiante'}
                `;
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error cargando datos del usuario', 'error');
            }
        }
        
        // Update profile
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('access_token');
            const name = document.getElementById('name').value;
            const career = document.getElementById('career').value;
            const semestre = parseInt(document.getElementById('semestre').value);
            
            try {
                const response = await fetch('/api/auth/me/', {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, career, semestre })
                });
                
                if (response.ok) {
                    showAlert('Perfil actualizado exitosamente', 'success');
                    if (window.playSound) window.playSound('success');
                    loadUserData();
                } else {
                    showAlert('Error actualizando perfil', 'error');
                    if (window.playSound) window.playSound('error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión', 'error');
            }
        });
        
        // Change password
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('Las contraseñas no coinciden', 'error');
                if (window.playSound) window.playSound('error');
                return;
            }
            
            if (newPassword.length < 8) {
                showAlert('La contraseña debe tener al menos 8 caracteres', 'error');
                if (window.playSound) window.playSound('error');
                return;
            }
            
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/api/auth/cambiar-password/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        old_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                if (response.ok) {
                    showAlert('Contraseña cambiada exitosamente', 'success');
                    if (window.playSound) window.playSound('success');
                    document.getElementById('passwordForm').reset();
                } else {
                    showAlert('Error cambiando contraseña. Verifica tu contraseña actual.', 'error');
                    if (window.playSound) window.playSound('error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión', 'error');
            }
        });
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                if (window.playSound) window.playSound('click');
                window.location.href = '/login.html';
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await loadUserData();
            
            // Navbar scroll effect
            window.addEventListener('scroll', function() {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
            
            // Audio controls
            document.getElementById('musicToggle').addEventListener('click', function() {
                if (window.toggleBackgroundMusic) {
                    window.toggleBackgroundMusic();
                    this.classList.toggle('active');
                }
                if (window.playSound) window.playSound('click');
            });
            
            document.getElementById('soundToggle').addEventListener('click', function() {
                if (window.sounds) {
                    window.sounds.enabled = !window.sounds.enabled;
                    this.classList.toggle('active');
                }
                if (window.playSound) window.playSound('click');
            });
            
            // Volume control
            document.getElementById('volumeSlider').addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                if (window.setVolume) {
                    window.setVolume(percent);
                }
                document.getElementById('volumeFill').style.width = (percent * 100) + '%';
            });
            
            // Avatar click
            document.getElementById('userAvatar').addEventListener('click', function() {
                window.location.href = '/account.html';
            });
            
            // Start background music
            setTimeout(() => {
                if (window.playBackgroundMusic) {
                    window.playBackgroundMusic();
                }
            }, 1000);
            
            // Tab click sounds
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.playSound) window.playSound('click');
                    // Update active styles
                    document.querySelectorAll('.nav-link').forEach(l => {
                        l.style.color = 'var(--color-gray-light)';
                    });
                    this.style.color = 'var(--color-white)';
                });
            });
        });
    </script>
</body>
</html>
