<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - StudentsPoint</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tema Oscuro Premium -->
    <link rel="stylesheet" href="/static/css/theme-dark.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/components.css">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4A148C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StudentsPoint">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/icons/icon-192x192.png">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    
    <!-- Background Pattern -->
    <div class="hero-background bg-pattern"></div>
    <div class="hero-particles" id="particles"></div>
    
    <!-- Demo Credentials Window -->
    <div class="glass animate-slide-in-right" style="position: fixed; bottom: 2rem; right: 2rem; padding: 1.5rem; max-width: 320px; z-index: 1000; border: 1px solid rgba(251, 191, 36, 0.3);">
        <h6 style="color: var(--color-gold); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-info-circle"></i> Usuarios Demo
        </h6>
        <div style="font-size: 0.875rem; color: var(--color-gray-light); margin-bottom: 1rem;">
            <p style="margin-bottom: 0.75rem;">
                <strong style="color: var(--color-white);">Admin:</strong><br>
                <code style="background: rgba(107, 70, 193, 0.3); padding: 0.25rem 0.5rem; border-radius: 0.25rem; display: block; margin-top: 0.25rem;">admin@studentspoint.app</code>
                <code style="background: rgba(107, 70, 193, 0.3); padding: 0.25rem 0.5rem; border-radius: 0.25rem; display: block; margin-top: 0.25rem;">admin123</code>
            </p>
            <p style="margin-bottom: 0;">
                <strong style="color: var(--color-white);">Estudiante:</strong><br>
                <code style="background: rgba(107, 70, 193, 0.3); padding: 0.25rem 0.5rem; border-radius: 0.25rem; display: block; margin-top: 0.25rem;">estudiante@studentspoint.app</code>
                <code style="background: rgba(107, 70, 193, 0.3); padding: 0.25rem 0.5rem; border-radius: 0.25rem; display: block; margin-top: 0.25rem;">estudiante123</code>
            </p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-sm btn-secondary" onclick="fillDemoCredentials('admin')" style="flex: 1; padding: 0.5rem;">
                <i class="fas fa-user-shield"></i> Admin
            </button>
            <button class="btn btn-sm btn-primary" onclick="fillDemoCredentials('student')" style="flex: 1; padding: 0.5rem;">
                <i class="fas fa-user"></i> Estudiante
            </button>
        </div>
    </div>

    <!-- Login Container -->
    <div class="glass animate-scale-in" style="max-width: 500px; width: 100%; padding: 3rem; border-radius: 1.5rem; position: relative; z-index: 10;">
        <!-- Logo -->
        <div class="text-center mb-4">
            <img src="/static/images/Logo_StudentsPoint.svg.png" alt="StudentsPoint" style="height: 80px; margin-bottom: 1.5rem;" class="animate-float">
            <h2 class="text-gradient-gold">Bienvenido de Vuelta</h2>
            <p style="color: var(--color-gray-light); margin-top: 0.5rem;">
                Inicia sesión para continuar
            </p>
        </div>
        
        <!-- Alert Container -->
        <div id="alertContainer"></div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope"></i> Correo Electrónico
                </label>
                <input type="email" class="form-input" id="email" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <div style="position: relative;">
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                    <button type="button" class="btn" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-gray-light); padding: 0;">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="mb-3">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="remember" style="width: 18px; height: 18px; cursor: pointer;">
                    <span style="color: var(--color-gray-light);">Recordarme</span>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
            
            <div class="divider-gradient"></div>
            
            <button type="button" class="btn btn-outline w-100 mb-3" id="googleLogin">
                <i class="fab fa-google"></i> Continuar con Google
            </button>
            
            <p class="text-center" style="color: var(--color-gray-light); margin-top: 2rem;">
                ¿No tienes cuenta? 
                <a href="/register.html" class="text-gradient-gold" style="font-weight: 600;">Regístrate aquí</a>
            </p>
            
            <!-- Botón de Instalación PWA -->
            <div id="pwa-install-container" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                <button id="install-button" class="btn btn-outline w-100" style="display: none;">
                    <i class="fas fa-download me-2"></i> Instalar StudentsPoint
                </button>
                <button id="install-button-manual" class="btn btn-outline w-100" style="display: none;">
                    <i class="fas fa-mobile-alt me-2"></i> Añadir a Pantalla de Inicio
                </button>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/sounds.js"></script>
    <script src="/static/js/auth-api.js"></script>
    
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
            
            if (window.playSound) window.playSound('click');
        });
        
        // Show alert
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            container.innerHTML = `
                <div class="${alertClass} animate-fade-in" style="margin-bottom: 1.5rem;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('loginBtn');
            
            // Disable button
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';
            
            try {
                const data = await window.authAPI.login(email, password);
                
                // Guardar preferencia de recordar
                if (remember) {
                    localStorage.setItem('remember_me', 'true');
                    localStorage.setItem('saved_email', email);
                } else {
                    localStorage.removeItem('remember_me');
                    localStorage.removeItem('saved_email');
                }
                
                showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                if (window.playSound) window.playSound('success');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (error) {
                console.error('Error:', error);
                showAlert(error.message || 'Error de conexión. Por favor, intenta de nuevo.');
                if (window.playSound) window.playSound('error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
            }
        });
        
        // Google Login
        document.getElementById('googleLogin').addEventListener('click', async function() {
            if (window.playSound) window.playSound('click');
            
            try {
                const response = await fetch('/api/auth/google/login/');
                const data = await response.json();
                
                if (data.auth_url) {
                    window.location.href = data.auth_url;
                } else {
                    showAlert('Error al iniciar sesión con Google', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión con Google', 'error');
            }
        });
        
        // Fill demo credentials
        window.fillDemoCredentials = function(type) {
            if (type === 'admin') {
                document.getElementById('email').value = 'admin@studentspoint.app';
                document.getElementById('password').value = 'admin123';
            } else if (type === 'student') {
                document.getElementById('email').value = 'estudiante@studentspoint.app';
                document.getElementById('password').value = 'estudiante123';
            }
            if (window.playSound) window.playSound('click');
        };
        
        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = 'rgba(251, 191, 36, 0.3)';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `particleFloat ${Math.random() * 10 + 10}s linear infinite`;
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }
        
        // Cargar credenciales guardadas
        function loadSavedCredentials() {
            const rememberMe = localStorage.getItem('remember_me');
            const savedEmail = localStorage.getItem('saved_email');
            
            if (rememberMe === 'true' && savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('remember').checked = true;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            loadSavedCredentials();
            
            // Start background music
            setTimeout(() => {
                if (window.playBackgroundMusic) {
                    window.playBackgroundMusic();
                }
            }, 1000);
            
            // Play page load sound
            if (window.playSound) {
                window.playSound('pageLoad');
            }
        });
    </script>
    
    <!-- PWA Scripts -->
    <script src="/static/pwa-config.js"></script>
    <script src="/static/js/pwa.js"></script>
    
    <script>
        // Manejo específico del botón de instalación en login
        document.addEventListener('DOMContentLoaded', function() {
            const installButton = document.getElementById('install-button');
            const installButtonManual = document.getElementById('install-button-manual');
            const installContainer = document.getElementById('pwa-install-container');
            let deferredPrompt;
            
            // Verificar si ya está instalado
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);
            const isMobile = isIOS || isAndroid;
            
            if (isStandalone) {
                console.log('PWA: Ya está instalado');
                if (installContainer) {
                    installContainer.style.display = 'none';
                }
                return;
            }
            
            // Mostrar siempre el contenedor en móviles
            if (isMobile && installContainer) {
                installContainer.style.display = 'block';
            }
            
            // Escuchar el evento beforeinstallprompt (Chrome/Edge)
            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('PWA: Prompt de instalación disponible');
                e.preventDefault();
                deferredPrompt = e;
                
                // Mostrar el botón automático
                if (installButton) {
                    installButton.style.display = 'block';
                    if (installContainer) {
                        installContainer.style.display = 'block';
                    }
                }
                
                // Ocultar el botón manual si hay prompt automático
                if (installButtonManual) {
                    installButtonManual.style.display = 'none';
                }
            });
            
            // Si no hay prompt automático después de 2 segundos, mostrar botón manual en móviles
            setTimeout(() => {
                if (!deferredPrompt && isMobile && installButtonManual) {
                    installButtonManual.style.display = 'block';
                    if (installContainer) {
                        installContainer.style.display = 'block';
                    }
                }
            }, 2000);
            
            // Manejar clic en el botón de instalación automático
            if (installButton) {
                installButton.addEventListener('click', async () => {
                    if (!deferredPrompt) {
                        showInstallInstructions();
                        return;
                    }
                    
                    try {
                        // Mostrar el prompt de instalación
                        deferredPrompt.prompt();
                        
                        // Esperar a que el usuario responda
                        const { outcome } = await deferredPrompt.userChoice;
                        console.log(`PWA: Usuario eligió: ${outcome}`);
                        
                        if (outcome === 'accepted') {
                            showAlert('¡StudentsPoint se está instalando!', 'success');
                        }
                        
                        // Limpiar el prompt
                        deferredPrompt = null;
                        if (installButton) {
                            installButton.style.display = 'none';
                        }
                    } catch (error) {
                        console.error('Error al mostrar prompt:', error);
                        showInstallInstructions();
                    }
                });
            }
            
            // Manejar clic en el botón de instalación manual
            if (installButtonManual) {
                installButtonManual.addEventListener('click', () => {
                    showInstallInstructions();
                });
            }
            
            // Detectar si ya está instalado
            window.addEventListener('appinstalled', () => {
                console.log('PWA: App instalada exitosamente');
                if (installButton) {
                    installButton.style.display = 'none';
                }
                if (installButtonManual) {
                    installButtonManual.style.display = 'none';
                }
                if (installContainer) {
                    installContainer.style.display = 'none';
                }
                deferredPrompt = null;
                showAlert('¡StudentsPoint instalado exitosamente!', 'success');
            });
            
            // Función para mostrar instrucciones de instalación manual
            function showInstallInstructions() {
                let message = '';
                if (isIOS) {
                    message = '📱 Para instalar en iOS:<br>1. Toca el botón de compartir (□↑)<br>2. Selecciona "Añadir a pantalla de inicio"<br>3. Toca "Añadir"';
                } else if (isAndroid) {
                    message = '📱 Para instalar en Android:<br>1. Toca el menú (⋮) en la esquina superior<br>2. Selecciona "Instalar app" o "Añadir a pantalla de inicio"<br>3. Confirma la instalación';
                } else {
                    message = '💻 Para instalar:<br>Usa el menú del navegador y selecciona "Instalar StudentsPoint" o busca el ícono de instalación en la barra de direcciones';
                }
                
                // Crear un modal o alert más visible
                const modal = document.createElement('div');
                modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 2rem;';
                modal.innerHTML = `
                    <div class="glass" style="max-width: 400px; width: 100%; padding: 2rem; border-radius: 1rem; position: relative;">
                        <button onclick="this.parentElement.parentElement.remove()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--color-white); font-size: 1.5rem; cursor: pointer;">&times;</button>
                        <h3 style="color: var(--color-gold); margin-bottom: 1rem;">Instalar StudentsPoint</h3>
                        <div style="color: var(--color-gray-light); line-height: 1.6;">
                            ${message}
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                
                // Cerrar al hacer clic fuera
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            }
        });
    </script>
</body>
</html>
