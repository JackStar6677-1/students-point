                        <ol>
                            <li><strong>Parpadeo:</strong> 10 veces lentamente cada 20 min</li>
                            <li><strong>Palming:</strong> Frota tus manos y colócalas sobre tus ojos cerrados por 30 seg</li>
                            <li><strong>Enfoque:</strong> Alterna entre mirar algo cercano (30cm) y lejano (6m)</li>

                    duracion: "3 min"

                {

                    descripcion: "Rutina rápida para aliviar tensión de cuello y hombros",
                    contenido: `
                        <h5>Rutina de 5 Minutos</h5>
                        <ol>
                            <li><strong>Cuello:</strong> Inclina la cabeza a cada lado (10 seg cada uno)</li>
                            <li><strong>Hombros:</strong> Encoge y suelta 10 veces</li>
                            <li><strong>Muñecas:</strong> Círculos 10 veces en cada dirección</li>
                            <li><strong>Espalda:</strong> Gira el torso sentado (15 seg cada lado)</li>
                        </ol>
                        <p><strong>Frecuencia:</strong> Cada 1-2 horas de coding</p>
                    `,
                    duracion: "5 min"
                }
            ],
            mental: [
                {
                    titulo: "Manejo del Estrés en Exámenes",
                    descripcion: "Técnicas para mantener la calma en períodos intensos",
                    contenido: `
                        <h5>Técnica de Respiración 4-7-8</h5>
                        <ol>
                            <li>Inhala por la nariz contando hasta 4</li>
                            <li>Mantén el aire contando hasta 7</li>

                    `,
                    duracion: "10 min"
                },
                {
                    titulo: "Síndrome del Impostor",
                    descripcion: "Cómo lidiar con la sensación de no ser suficientemente bueno",
                    contenido: `
                        <h5>Eres Normal</h5>
                        <p>El 70% de los programadores experimentan síndrome del impostor.</p>
                        <h5>Estrategias</h5>
                        <ul>
                            <li>Documenta tus logros en un archivo "wins.md"</li>
                            <li>Comparte tus dudas (descubrirás que muchos sienten lo mismo)</li>
                            <li>Recuerda: nadie sabe TODO sobre programación</li>

                        </ul>

                    `,
                    duracion: "8 min"
                },
                {
                    titulo: "Deep Work: Concentración Profunda",
                    descripcion: "Técnicas para entrar en estado de flow",
                    contenido: `
                        <h5>Preparación del Entorno</h5>
                        <ul>
                            <li>Escritorio limpio, solo lo esencial</li>
                            <li>Modo Focus: Bloquea todas las notificaciones</li>
                            <li>VS Code Modo Zen: Ctrl/Cmd + K → Z</li>
                        </ul>

                        <ul>

                            <li>11:00-11:30: Break</li>
                            <li>11:30-13:00: Deep Work</li>
                        </ul>
                        <p><strong>Regla de Oro:</strong> Una ventana = Un proyecto</p>
                    `,
                    duracion: "12 min"
                }
            ],
            nutricional: [
                {
                    titulo: "Alimentación para el Cerebro",
                    descripcion: "Qué comer para maximizar rendimiento mental",
                    contenido: `
                        <h5>Top 5 Alimentos Brain-Boost</h5>
                        <ol>
                            <li><strong>Arándanos:</strong> Antioxidantes para memoria</li>
                            <li><strong>Nueces:</strong> Omega-3 y vitamina E</li>
                            <li><strong>Huevos:</strong> Colina para neurotransmisores</li>
                            <li><strong>Aguacate:</strong> Grasas saludables</li>
                            <li><strong>Chocolate negro (85%+):</strong> Flavonoides</li>
                        </ol>
                        <h5>Desayuno Power</h5>
                        <p>2 huevos + avena con arándanos + té verde</p>
                    `,
                    duracion: "15 min"
                },
                {
                    titulo: "Hidratación Óptima",
                    descripcion: "Mantén tu cerebro hidratado para máximo rendimiento",
                    contenido: `
                        <h5>¿Cuánta Agua?</h5>
                        <p><strong>Fórmula:</strong> 33ml x tu peso en kg</p>
                        <p>Ejemplo: 70kg → 2.3 litros al día</p>
                        <h5>Regla del Pomodoro Hidratante</h5>
                        <p>Cada Pomodoro (25 min), toma un vaso de agua (200ml)</p>
                        <p>8 Pomodoros = 1.6L de agua ✅</p>
                        <h5>Señales de Deshidratación</h5>
                        <ul>
                            <li>Dolor de cabeza</li>
                            <li>Dificultad para concentrarse</li>
                            <li>Orina oscura</li>
                        </ul>
                    `,
                    duracion: "5 min"
                },
                {
                    titulo: "Cafeína: Guía de Uso",
                    descripcion: "Cómo usar el café inteligentemente",
                    contenido: `
                        <h5>Límite Seguro</h5>
                        <p><strong>Máximo:</strong> 400mg al día (4 tazas de café)</p>
                        <h5>Timing Óptimo</h5>
                        <ul>
                            <li>Primera taza: 90-120 min después de despertar</li>
                            <li>Segunda: 10:30-11:30 AM</li>
                            <li>Última: Antes de las 14:00</li>
                        </ul>
                        <h5>Alternativas</h5>
                        <p><strong>Té verde:</strong> Cafeína + L-teanina = Concentración sin nerviosismo</p>
                        <p><strong>Nap Coffee:</strong> Toma café → Siesta 20 min → Energía máxima</p>

                    duracion: "7 min"
                }

        };

        let carreraActual = '';

        // Habilitar botón cuando se selecciona carrera
        document.getElementById('carrera-select').addEventListener('change', function() {
            const loadBtn = document.getElementById('load-btn');
            loadBtn.disabled = !this.value;
        });

        function loadConsejos() {
            const select = document.getElementById('carrera-select');
            carreraActual = select.value;
            
            if (!carreraActual) return;
            
            // Ocultar selector, mostrar contenido
            document.getElementById('carrera-selector').style.display = 'none';
            document.getElementById('consejos-container').style.display = 'block';
            
            // Actualizar título
            document.getElementById('carrera-titulo').textContent = select.options[select.selectedIndex].text;
            
            // Cargar consejos
            if (carreraActual === 'informatica') {
                cargarConsejosInformatica();
            }
        }

        function cargarConsejosInformatica() {
            // Físico
            const fisicoContent = document.getElementById('fisico-content');
            fisicoContent.innerHTML = consejosInformatica.fisico.map(consejo => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="glass h-100">
                        <div class="p-4">
                            <div class="d-flex align-items-center mb-3">
                                <i class="fas fa-dumbbell fa-2x text-primary me-3"></i>
                                <div>
                                    <h5 class="mb-0">${consejo.titulo}</h5>
                                    <small class="text-muted"><i class="fas fa-clock"></i> ${consejo.duracion}</small>
                                </div>
                            </div>
                            <p class="text-muted small">${consejo.descripcion}</p>
                            <button class="btn btn-outline-primary btn-sm w-100" onclick='mostrarDetalle(${JSON.stringify(consejo)})'>
                                <i class="fas fa-info-circle"></i> Ver Detalles
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Mental
            const mentalContent = document.getElementById('mental-content');
            mentalContent.innerHTML = consejosInformatica.mental.map(consejo => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="glass h-100">
                        <div class="p-4">
                            <div class="d-flex align-items-center mb-3">
                                <i class="fas fa-brain fa-2x text-info me-3"></i>
                                <div>
                                    <h5 class="mb-0">${consejo.titulo}</h5>
                                    <small class="text-muted"><i class="fas fa-clock"></i> ${consejo.duracion}</small>
                                </div>
                            </div>
                            <p class="text-muted small">${consejo.descripcion}</p>
                            <button class="btn btn-outline-info btn-sm w-100" onclick='mostrarDetalle(${JSON.stringify(consejo)})'>
                                <i class="fas fa-info-circle"></i> Ver Detalles
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Nutricional
            const nutricionalContent = document.getElementById('nutricional-content');
            nutricionalContent.innerHTML = consejosInformatica.nutricional.map(consejo => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="glass h-100">
                        <div class="p-4">
                            <div class="d-flex align-items-center mb-3">
                                <i class="fas fa-apple-alt fa-2x text-success me-3"></i>
                                <div>
                                    <h5 class="mb-0">${consejo.titulo}</h5>
                                    <small class="text-muted"><i class="fas fa-clock"></i> ${consejo.duracion}</small>
                                </div>
                            </div>
                            <p class="text-muted small">${consejo.descripcion}</p>
                            <button class="btn btn-outline-success btn-sm w-100" onclick='mostrarDetalle(${JSON.stringify(consejo)})'>
                                <i class="fas fa-info-circle"></i> Ver Detalles
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function mostrarDetalle(consejo) {
            // Crear modal dinámicamente
            const modalHtml = `
                <div class="modal fade" id="detalleModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">${consejo.titulo}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ${consejo.contenido}
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Eliminar modal anterior si existe
            const oldModal = document.getElementById('detalleModal');
            if (oldModal) oldModal.remove();
            
            // Agregar nuevo modal
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('detalleModal'));
            modal.show();
            
            // Limpiar al cerrar
            document.getElementById('detalleModal').addEventListener('hidden.bs.modal', function() {
                this.remove();
            });
        }

        function backToSelector() {
            document.getElementById('carrera-selector').style.display = 'block';
            document.getElementById('consejos-container').style.display = 'none';
        }

        function logout() {
            if (window.authAPI) {
                window.authAPI.logout(true);
            } else {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user_data');
                window.location.replace('/login.html');
            }
        }

        // Cargar usuario
        document.addEventListener('DOMContentLoaded', function() {
            const userName = localStorage.getItem('user_name') || 'Usuario';
            const userRole = localStorage.getItem('user_career') || 'Estudiante';
            document.getElementById('sidebarUserName').textContent = userName;
            document.getElementById('sidebarUserRole').textContent = userRole;
        });
    </script>

            color: white !important;
        }

        /* Ajustar el iframe del chat */
        #retell-widget-iframe {
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(75, 0, 130, 0.3) !important;
        }

        /* Responsive: ajustar en móviles */

            #retell-widget-button {
                bottom: 70px !important;
                right: 15px !important;
                width: 56px !important;
                height: 56px !important;
            }

            #retell-widget-iframe {
                width: calc(100vw - 20px) !important;
                height: calc(100vh - 100px) !important;
                bottom: 10px !important;
                right: 10px !important;
            }
        }

        /* Animación de entrada suave */
        @keyframes slideInBot {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #retell-widget-button {
            animation: slideInBot 0.5s ease-out;
        }

        /* Indicador de que el bot está activo */
        #retell-widget-button::after {
            content: '';
            position: absolute;
            top: -5px;
            right: -5px;
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            border: 2px solid #1a1a1b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }
    </style>

    <!-- Script para mejorar la integración del bot -->
    <script>
        // Esperar a que el widget esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            // Personalizar el mensaje de bienvenida según el usuario
            setTimeout(function() {
                const userName = localStorage.getItem('user_name') || 'estudiante';
                const retellWidget = document.querySelector('#retell-widget');
                
                if (retellWidget) {
                    // Actualizar mensaje con nombre del usuario
                    const customMessage = `¡Hola ${userName}! 👋 Soy SPBot, tu asistente de bienestar estudiantil. ¿En qué puedo ayudarte hoy?`;
                    
                    // Intentar actualizar el mensaje si el widget lo permite
                    try {
                        retellWidget.setAttribute('data-popup-message', customMessage);
                    } catch (e) {
                        console.log('Widget personalizado con configuración por defecto');
                    }
                }
            }, 1000);

            // Registrar interacciones con el bot para analytics
            document.addEventListener('click', function(e) {
                if (e.target.closest('#retell-widget-button')) {
                    console.log('🤖 Usuario interactuando con SPBot');
                    // Aquí podrías añadir analytics si lo deseas
                }
            });
        });

        // Función para abrir el bot programáticamente si se necesita
        window.abrirAsistenteBienestar = function() {
            const widgetButton = document.querySelector('#retell-widget-button');
            if (widgetButton) {
                widgetButton.click();
            }
        };
    </script>
</body>
</html>
